<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steel Fabrication Nesting Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Theme Color Variables */
    :root[data-theme="dark-slate"] {
      --bg-color: #090d16;
      --sidebar-bg: #0d1322;
      --card-bg: #151e32;
      --card-bg-hover: #1c2742;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --input-bg: #0b1120;
      --input-border: #334155;
      --canvas-bg: #10172a;
      --sheet-bg: #1e293b;
      --danger-color: #ef4444;
    }

    :root[data-theme="midnight-blue"] {
      --bg-color: #050b14;
      --sidebar-bg: #0a1426;
      --card-bg: #0f1d38;
      --card-bg-hover: #172a4e;
      --accent-color: #818cf8;
      --accent-hover: #6366f1;
      --accent-glow: rgba(129, 140, 248, 0.15);
      --text-main: #f1f5f9;
      --text-muted: #8094b2;
      --border-color: #1e2d4a;
      --input-bg: #070e1b;
      --input-border: #293d63;
      --canvas-bg: #081020;
      --sheet-bg: #182642;
      --danger-color: #f87171;
    }

    :root[data-theme="light-modern"] {
      --bg-color: #f8fafc;
      --sidebar-bg: #ffffff;
      --card-bg: #ffffff;
      --card-bg-hover: #f1f5f9;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --accent-glow: rgba(2, 132, 199, 0.15);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --input-bg: #f8fafc;
      --input-border: #cbd5e1;
      --canvas-bg: #f1f5f9;
      --sheet-bg: #e2e8f0;
      --danger-color: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--input-border); border-radius: 4px; }

    /* Sidebar */
    .sidebar { 
      width: 300px; 
      background-color: var(--sidebar-bg); 
      border-right: 1px solid var(--border-color); 
      display: flex; 
      flex-direction: column; 
      padding: 1.25rem; 
      flex-shrink: 0;
    }
    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
    }
    .sidebar h2 { font-size: 0.95rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent-color); }
    .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.6rem; padding-right: 0.25rem; }
    .history-item { 
      background: var(--card-bg); 
      padding: 0.85rem; 
      border-radius: 8px; 
      cursor: pointer; 
      border: 1px solid var(--border-color); 
      transition: all 0.2s ease;
    }
    .history-item:hover { border-color: var(--accent-color); background: var(--card-bg-hover); transform: translateY(-1px); }
    .history-item .title { font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.25rem; }
    .history-item .meta { color: var(--text-muted); font-size: 0.75rem; line-height: 1.3; }

    .btn-clear {
      background: transparent;
      border: 1px solid var(--danger-color);
      color: var(--danger-color);
      padding: 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 6px;
      margin-top: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-clear:hover { background: var(--danger-color); color: #fff; }

    /* Main Container */
    .main-container { flex: 1; display: grid; grid-template-columns: 380px 1fr; gap: 1.25rem; padding: 1.25rem; overflow-y: auto; }
    .panel { 
      background: var(--card-bg); 
      border: 1px solid var(--border-color); 
      border-radius: 12px; 
      padding: 1.5rem; 
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    h3 { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent-color); border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
    .form-group { margin-bottom: 0.25rem; }
    label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.02em; }
    input, select { 
      width: 100%; 
      padding: 0.6rem 0.75rem; 
      background: var(--input-bg); 
      border: 1px solid var(--input-border); 
      border-radius: 6px; 
      color: var(--text-main); 
      font-size: 0.875rem; 
      outline: none;
      transition: all 0.2s ease;
    }
    input:focus, select:focus { border-color: var(--accent-color); box-shadow: 0 0 0 3px var(--accent-glow); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

    .btn-calc { 
      width: 100%; 
      padding: 0.85rem; 
      background: var(--accent-color); 
      color: var(--bg-color); 
      border: none; 
      border-radius: 6px; 
      font-size: 0.875rem;
      font-weight: 700; 
      letter-spacing: 0.02em;
      cursor: pointer; 
      margin-top: 0.5rem; 
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    .btn-calc:hover { background: var(--accent-hover); color: #fff; }

    /* Results Grid */
    .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.75rem; }
    .stat-card { 
      background: var(--input-bg); 
      padding: 1rem; 
      border-radius: 8px; 
      border: 1px solid var(--border-color); 
      position: relative;
      overflow: hidden;
    }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--accent-color); }
    .stat-card .val { font-size: 1.35rem; font-weight: 700; color: var(--text-main); line-height: 1.2; }
    .stat-card .lbl { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 0.25rem; }

    .canvas-container { 
      background: var(--canvas-bg); 
      border: 1px solid var(--border-color); 
      border-radius: 8px; 
      padding: 1.25rem; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      flex: 1;
      min-height: 380px; 
    }
    canvas { background: var(--sheet-bg); border: 1px dashed var(--input-border); border-radius: 4px; max-width: 100%; max-height: 480px; }
  </style>
</head>
<body data-theme="dark-slate">

  <div class="sidebar">
    <div class="sidebar-header">
      <h2>History</h2>
    </div>
    <div class="history-list" id="historyList"></div>
    <button class="btn-clear" onclick="clearHistory()">Clear History</button>
  </div>

  <div class="main-container">
    
    <div class="panel">
      <div>
        <h3>Settings & Visuals</h3>
        <div class="form-group grid-2" style="margin-top: 0.75rem;">
          <div>
            <label>UI Theme</label>
            <select id="themeSelect" onchange="changeTheme(this.value)">
              <option value="dark-slate">Dark Slate</option>
              <option value="midnight-blue">Midnight Blue</option>
              <option value="light-modern">Light Modern</option>
            </select>
          </div>
          <div>
            <label>Sheet View</label>
            <select id="viewMode" onchange="calculateAndRender()">
              <option value="full">Full Sheet</option>
              <option value="crop">Grid Layout</option>
            </select>
          </div>
        </div>
      </div>

      <div>
        <h3>1. Material & Sheet</h3>
        <div class="form-group grid-2" style="margin-top: 0.75rem;">
          <div>
            <label>Material Type</label>
            <select id="matType">
              <option value="SS">Stainless Steel (SS)</option>
              <option value="MS">Mild Steel (MS)</option>
            </select>
          </div>
          <div>
            <label>Thickness (mm)</label>
            <input type="number" id="thickness" value="2.0" step="0.1">
          </div>
        </div>

        <div class="form-group grid-2">
          <div>
            <label>Sheet Width (mm)</label>
            <input type="number" id="sheetW" value="1250">
          </div>
          <div>
            <label>Sheet Height (mm)</label>
            <input type="number" id="sheetH" value="2500">
          </div>
        </div>
      </div>

      <div>
        <h3>2. Component & Spacing</h3>
        <div class="form-group grid-2" style="margin-top: 0.75rem;">
          <div>
            <label>Part Width (mm)</label>
            <input type="number" id="partW" value="300">
          </div>
          <div>
            <label>Part Height (mm)</label>
            <input type="number" id="partH" value="400">
          </div>
        </div>
        <div class="form-group grid-2">
          <div>
            <label>Required Qty</label>
            <input type="number" id="partQty" value="15">
          </div>
          <div>
            <label>Spacing / Kerf (mm)</label>
            <input type="number" id="spacing" value="5">
          </div>
        </div>
      </div>

      <button class="btn-calc" onclick="calculateAndRender()">Calculate Layout</button>
    </div>

    <div class="panel">
      <h3>Nesting Layout</h3>
      
      <div class="results-grid">
        <div class="stat-card">
          <div class="val" id="resParts">0</div>
          <div class="lbl">Fitted Parts</div>
        </div>
        <div class="stat-card">
          <div class="val" id="resSheets">0</div>
          <div class="lbl">Sheets Needed</div>
        </div>
        <div class="stat-card">
          <div class="val" id="resUtil">0%</div>
          <div class="lbl">Sheet Utilization</div>
        </div>
        <div class="stat-card">
          <div class="val" id="resWastage">0%</div>
          <div class="lbl">Wastage</div>
        </div>
      </div>

      <div class="canvas-container">
        <canvas id="nestCanvas" width="600" height="400"></canvas>
      </div>
    </div>

  </div>

  <script>
    function changeTheme(themeName) {
      document.body.setAttribute('data-theme', themeName);
      calculateAndRender();
    }

    function clearHistory() {
      localStorage.removeItem('steel_calc_history');
      renderHistory();
    }

    function calculateAndRender() {
      const sheetW = parseFloat(document.getElementById('sheetW').value);
      const sheetH = parseFloat(document.getElementById('sheetH').value);
      const partW = parseFloat(document.getElementById('partW').value);
      const partH = parseFloat(document.getElementById('partH').value);
      const partQty = parseInt(document.getElementById('partQty').value);
      const spacing = parseFloat(document.getElementById('spacing').value);
      const matType = document.getElementById('matType').value;
      const thickness = document.getElementById('thickness').value;

      const effPartW = partW + spacing;
      const effPartH = partH + spacing;

      const cols = Math.floor((sheetW + spacing) / effPartW);
      const rows = Math.floor((sheetH + spacing) / effPartH);
      const partsPerSheet = cols * rows;

      if (partsPerSheet === 0) {
        alert("Part size with spacing exceeds sheet dimensions!");
        return;
      }

      const sheetsNeeded = Math.ceil(partQty / partsPerSheet);
      const singleSheetArea = sheetW * sheetH;
      const totalPartAreaOnSheet = partsPerSheet * (partW * partH);
      const utilization = ((totalPartAreaOnSheet / singleSheetArea) * 100).toFixed(1);
      const wastage = (100 - utilization).toFixed(1);

      document.getElementById('resParts').innerText = `${partsPerSheet} / sheet`;
      document.getElementById('resSheets').innerText = sheetsNeeded;
      document.getElementById('resUtil').innerText = `${utilization}%`;
      document.getElementById('resWastage').innerText = `${wastage}%`;

      drawLayout(sheetW, sheetH, partW, partH, cols, rows, spacing);

      saveToHistory({
        title: `${matType} ${thickness}mm - ${partW}x${partH}mm`,
        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        details: `${partsPerSheet} parts/sheet | Util: ${utilization}%`
      });
    }

    function drawLayout(sheetW, sheetH, partW, partH, cols, rows, spacing) {
      const canvas = document.getElementById('nestCanvas');
      const ctx = canvas.getContext('2d');
      const viewMode = document.getElementById('viewMode').value;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const targetW = viewMode === 'crop' ? Math.min((cols * (partW + spacing)), sheetW) : sheetW;
      const targetH = viewMode === 'crop' ? Math.min((rows * (partH + spacing)), sheetH) : sheetH;

      const padding = 20;
      const scale = Math.min((canvas.width - padding * 2) / targetW, (canvas.height - padding * 2) / targetH);

      const renderW = targetW * scale;
      const renderH = targetH * scale;

      const computedStyle = getComputedStyle(document.body);
      const sheetColor = computedStyle.getPropertyValue('--sheet-bg').trim();
      const accentColor = computedStyle.getPropertyValue('--accent-color').trim();
      const borderColor = computedStyle.getPropertyValue('--input-border').trim();

      ctx.fillStyle = sheetColor;
      ctx.fillRect(padding, padding, renderW, renderH);
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 1;
      ctx.strokeRect(padding, padding, renderW, renderH);

      ctx.fillStyle = accentColor;
      ctx.strokeStyle = sheetColor;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = padding + (c * (partW + spacing)) * scale;
          const y = padding + (r * (partH + spacing)) * scale;
          const w = partW * scale;
          const h = partH * scale;

          ctx.fillRect(x, y, w, h);
          ctx.strokeRect(x, y, w, h);
        }
      }
    }

    function saveToHistory(record) {
      let history = JSON.parse(localStorage.getItem('steel_calc_history') || '[]');
      history.unshift(record);
      if (history.length > 20) history.pop();
      localStorage.setItem('steel_calc_history', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const historyList = document.getElementById('historyList');
      const history = JSON.parse(localStorage.getItem('steel_calc_history') || '[]');
      if (history.length === 0) {
        historyList.innerHTML = '<div style="color: var(--text-muted); font-size: 0.8rem; text-align: center; margin-top: 1rem;">No saved items</div>';
        return;
      }
      historyList.innerHTML = history.map(item => `
        <div class="history-item">
          <div class="title">${item.title}</div>
          <div class="meta">${item.date} — ${item.details}</div>
        </div>
      `).join('');
    }

    renderHistory();
    calculateAndRender();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steel Fabrication Nesting Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body data-theme="dark-slate">

  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Saved History Options</h2>
    </div>

    <div class="history-select-box">
      <label>Select Saved Job</label>
      <select id="historyDropdown" onchange="loadSelectedFromDropdown(this.value)">
        <option value="">-- Choose from History --</option>
      </select>
    </div>

    <div class="history-list" id="historyList"></div>
    <button class="btn-clear" onclick="clearHistory()">Clear History</button>
  </div>

  <div class="main-container" id="pdfExportArea">
    
    <div style="display: flex; flex-direction: column; gap: 1rem;">
      
      <div class="section-block">
        <div class="section-title">Job & Component Setup</div>
        <div class="form-group grid-2">
          <div>
            <label>Job Name</label>
            <input type="text" id="jobName" value="Kitchen Table Unit">
          </div>
          <div>
            <label>Component Name</label>
            <input type="text" id="compName" value="Top Shelf">
          </div>
        </div>
        <div class="form-group grid-2">
          <div>
            <label>UI Theme</label>
            <select id="themeSelect" onchange="changeTheme(this.value)">
              <option value="dark-slate">Dark Slate</option>
              <option value="light-modern">Light Modern</option>
            </select>
          </div>
          <div>
            <label>Sheet View</label>
            <select id="viewMode" onchange="calculateAndRender()">
              <option value="full">Full Sheet</option>
              <option value="crop">Grid Layout</option>
            </select>
          </div>
        </div>
      </div>

      <div class="section-block highlight">
        <div class="section-title">Material & Sheet Specs</div>
        <div class="form-group grid-2">
          <div>
            <label>Material Type</label>
            <select id="matType">
              <option value="SS">Stainless Steel (SS)</option>
              <option value="MS">Mild Steel (MS)</option>
            </select>
          </div>
          <div>
            <label>Thickness (mm)</label>
            <input type="number" id="thickness" value="2.0" step="0.1">
          </div>
        </div>
        <div class="form-group grid-2">
          <div>
            <label>Sheet Width (mm)</label>
            <input type="number" id="sheetW" value="1250">
          </div>
          <div>
            <label>Sheet Height (mm)</label>
            <input type="number" id="sheetH" value="2500">
          </div>
        </div>
      </div>

      <div class="section-block">
        <div class="section-title">Component Dimensions & Spacing</div>
        <div class="form-group grid-2">
          <div>
            <label>Part Width (mm)</label>
            <input type="number" id="partW" value="300">
          </div>
          <div>
            <label>Part Height (mm)</label>
            <input type="number" id="partH" value="400">
          </div>
        </div>
        <div class="form-group grid-2">
          <div>
            <label>Required Qty</label>
            <input type="number" id="partQty" value="15">
          </div>
          <div>
            <label>Spacing / Kerf (mm)</label>
            <input type="number" id="spacing" value="5">
          </div>
        </div>
      </div>

      <div class="btn-action-group">
        <button class="btn-calc" onclick="calculateAndRender()">Calculate Layout</button>
        <button class="btn-pdf" onclick="exportToPDF()">Export PDF</button>
      </div>

    </div>

    <div class="section-block" style="flex: 1;">
      <div class="section-title">Nesting Visual & Metrics Output</div>
      
      <div class="results-grid">
        <div class="stat-card">
          <div class="val" id="resParts">0</div>
          <div class="lbl">Fitted Parts</div>
        </div>
        <div class="stat-card">
          <div class="val" id="resSheets">0</div>
          <div class="lbl">Sheets Needed</div>
        </div>
        <div class="stat-card">
          <div class="val" id="resUtil">0%</div>
          <div class="lbl">Utilization</div>
        </div>
        <div class="stat-card">
          <div class="val" id="resWastage">0%</div>
          <div class="lbl">Wastage</div>
        </div>
      </div>

      <div class="canvas-container">
        <canvas id="nestCanvas" width="600" height="420"></canvas>
      </div>
    </div>

  </div>

  <script>
    let currentHistory = [];

    function changeTheme(themeName) {
      document.body.setAttribute('data-theme', themeName);
      calculateAndRender();
    }

    function clearHistory() {
      localStorage.removeItem('steel_calc_history');
      renderHistory();
    }

    function calculateAndRender() {
      const jobName = document.getElementById('jobName').value || 'Unnamed Job';
      const compName = document.getElementById('compName').value || 'Part';
      const sheetW = parseFloat(document.getElementById('sheetW').value);
      const sheetH = parseFloat(document.getElementById('sheetH').value);
      const partW = parseFloat(document.getElementById('partW').value);
      const partH = parseFloat(document.getElementById('partH').value);
      const partQty = parseInt(document.getElementById('partQty').value);
      const spacing = parseFloat(document.getElementById('spacing').value);
      const matType = document.getElementById('matType').value;
      const thickness = document.getElementById('thickness').value;

      const effPartW = partW + spacing;
      const effPartH = partH + spacing;

      const cols = Math.floor((sheetW + spacing) / effPartW);
      const rows = Math.floor((sheetH + spacing) / effPartH);
      const partsPerSheet = cols * rows;

      if (partsPerSheet === 0) {
        alert("Part dimensions exceed target sheet size!");
        return;
      }

      const sheetsNeeded = Math.ceil(partQty / partsPerSheet);
      const singleSheetArea = sheetW * sheetH;
      const totalPartAreaOnSheet = partsPerSheet * (partW * partH);
      const utilization = ((totalPartAreaOnSheet / singleSheetArea) * 100).toFixed(1);
      const wastage = (100 - utilization).toFixed(1);

      document.getElementById('resParts').innerText = `${partsPerSheet} / sheet`;
      document.getElementById('resSheets').innerText = sheetsNeeded;
      document.getElementById('resUtil').innerText = `${utilization}%`;
      document.getElementById('resWastage').innerText = `${wastage}%`;

      drawLayout(sheetW, sheetH, partW, partH, cols, rows, spacing, compName);

      saveToHistory({
        jobName,
        compName,
        matType,
        thickness,
        sheetW,
        sheetH,
        partW,
        partH,
        partQty,
        spacing,
        partsPerSheet,
        utilization,
        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
    }

    function drawLayout(sheetW, sheetH, partW, partH, cols, rows, spacing, compName) {
      const canvas = document.getElementById('nestCanvas');
      const ctx = canvas.getContext('2d');
      const viewMode = document.getElementById('viewMode').value;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const targetW = viewMode === 'crop' ? Math.min((cols * (partW + spacing)), sheetW) : sheetW;
      const targetH = viewMode === 'crop' ? Math.min((rows * (partH + spacing)), sheetH) : sheetH;

      const padding = 20;
      const scale = Math.min((canvas.width - padding * 2) / targetW, (canvas.height - padding * 2) / targetH);

      const renderW = targetW * scale;
      const renderH = targetH * scale;

      const computedStyle = getComputedStyle(document.body);
      const sheetColor = computedStyle.getPropertyValue('--sheet-bg').trim();
      const accentColor = computedStyle.getPropertyValue('--accent-color').trim();
      const borderColor = computedStyle.getPropertyValue('--border-color').trim();

      ctx.fillStyle = sheetColor;
      ctx.fillRect(padding, padding, renderW, renderH);
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 2;
      ctx.strokeRect(padding, padding, renderW, renderH);

      ctx.fillStyle = accentColor;
      ctx.strokeStyle = sheetColor;
      ctx.font = '10px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = padding + (c * (partW + spacing)) * scale;
          const y = padding + (r * (partH + spacing)) * scale;
          const w = partW * scale;
          const h = partH * scale;

          ctx.fillRect(x, y, w, h);
          ctx.strokeRect(x, y, w, h);

          if (w > 35 && h > 15) {
            ctx.fillStyle = "#000000";
            ctx.fillText(compName, x + w / 2, y + h / 2);
            ctx.fillStyle = accentColor;
          }
        }
      }
    }

    function saveToHistory(record) {
      let history = JSON.parse(localStorage.getItem('steel_calc_history') || '[]');
      history = history.filter(h => !(h.jobName === record.jobName && h.compName === record.compName && h.partW === record.partW && h.partH === record.partH));
      history.unshift(record);
      if (history.length > 15) history.pop();
      localStorage.setItem('steel_calc_history', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const historyList = document.getElementById('historyList');
      const historyDropdown = document.getElementById('historyDropdown');
      currentHistory = JSON.parse(localStorage.getItem('steel_calc_history') || '[]');
      
      if (currentHistory.length === 0) {
        historyList.innerHTML = '<div style="color: var(--text-muted); font-size: 0.8rem; text-align: center; margin-top: 1rem;">No saved jobs</div>';
        historyDropdown.innerHTML = '<option value="">-- No History Available --</option>';
        return;
      }

      historyDropdown.innerHTML = '<option value="">-- Select Job to Load --</option>' + 
        currentHistory.map((item, index) => `<option value="${index}">${item.jobName} - ${item.compName}</option>`).join('');

      historyList.innerHTML = currentHistory.map((item, index) => `
        <div class="history-item" onclick="loadHistoryItem(${index})">
          <div class="job-tag">${item.jobName}</div>
          <div class="title">${item.compName} (${item.partW}x${item.partH}mm)</div>
          <div class="meta">${item.matType} ${item.thickness}mm | Util: ${item.utilization}%</div>
        </div>
      `).join('');
    }

    function loadSelectedFromDropdown(val) {
      if (val !== "") loadHistoryItem(parseInt(val));
    }

    function loadHistoryItem(index) {
      const item = currentHistory[index];
      if (!item) return;

      document.getElementById('jobName').value = item.jobName;
      document.getElementById('compName').value = item.compName;
      document.getElementById('matType').value = item.matType;
      document.getElementById('thickness').value = item.thickness;
      document.getElementById('sheetW').value = item.sheetW;
      document.getElementById('sheetH').value = item.sheetH;
      document.getElementById('partW').value = item.partW;
      document.getElementById('partH').value = item.partH;
      document.getElementById('partQty').value = item.partQty;
      document.getElementById('spacing').value = item.spacing;

      calculateAndRender();
    }

    function exportToPDF() {
      const element = document.getElementById('pdfExportArea');
      const jobName = document.getElementById('jobName').value || 'Nesting_Layout';
      const compName = document.getElementById('compName').value || 'Component';
      
      const opt = {
        margin:       0.2,
        filename:     `${jobName}_${compName}_Nesting.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'in', format: 'letter', orientation: 'landscape' }
      };

      html2pdf().set(opt).from(element).save();
    }

    renderHistory();
    calculateAndRender();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steel Fabrication Nesting & Laser Calculator</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar History */
    .sidebar { width: 280px; background-color: #0b1120; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 1rem; }
    .sidebar h2 { font-size: 1.1rem; margin-bottom: 1rem; color: var(--accent-color); }
    .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; }
    .history-item { background: var(--card-bg); padding: 0.75rem; border-radius: 6px; cursor: pointer; border: 1px solid var(--border-color); font-size: 0.85rem; }
    .history-item:hover { border-color: var(--accent-color); }
    .history-item .title { font-weight: bold; margin-bottom: 0.2rem; }
    .history-item .meta { color: var(--text-muted); font-size: 0.75rem; }

    /* Main Content */
    .main-container { flex: 1; display: grid; grid-template-columns: 360px 1fr; gap: 1rem; padding: 1rem; overflow-y: auto; }
    .panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 1.25rem; }

    h3 { margin-bottom: 1rem; font-size: 1rem; color: var(--text-main); border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }

    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.25rem; }
    input, select { width: 100%; padding: 0.5rem; background: #0f172a; border: 1px solid var(--border-color); border-radius: 4px; color: #fff; font-size: 0.9rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }

    button { width: 100%; padding: 0.75rem; background: var(--accent-color); color: #0f172a; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 0.5rem; }
    button:hover { background: var(--accent-hover); color: #fff; }

    /* Output Section */
    .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
    .stat-card { background: #0f172a; padding: 0.75rem; border-radius: 6px; border: 1px solid var(--border-color); }
    .stat-card .val { font-size: 1.2rem; font-weight: bold; color: var(--accent-color); }
    .stat-card .lbl { font-size: 0.75rem; color: var(--text-muted); }

    .canvas-container { background: #0f172a; border: 1px solid var(--border-color); border-radius: 6px; padding: 1rem; display: flex; justify-content: center; align-items: center; min-height: 400px; }
    canvas { background: #1e293b; border: 1px dashed var(--text-muted); max-width: 100%; max-height: 500px; }
  </style>
</head>
<body>

  <!-- Sidebar: Saved History -->
  <div class="sidebar">
    <h2>Calculation History</h2>
    <div class="history-list" id="historyList"></div>
  </div>

  <!-- Main Work Area -->
  <div class="main-container">
    
    <!-- Inputs Panel -->
    <div class="panel">
      <h3>1. Material & Sheet</h3>
      <div class="form-group grid-2">
        <div>
          <label>Material Type</label>
          <select id="matType">
            <option value="SS">Stainless Steel (SS)</option>
            <option value="MS">Mild Steel (MS)</option>
          </select>
        </div>
        <div>
          <label>Thickness (mm)</label>
          <input type="number" id="thickness" value="2.0" step="0.1">
        </div>
      </div>

      <div class="form-group grid-2">
        <div>
          <label>Sheet Width (mm)</label>
          <input type="number" id="sheetW" value="1250">
        </div>
        <div>
          <label>Sheet Height (mm)</label>
          <input type="number" id="sheetH" value="2500">
        </div>
      </div>

      <h3>2. Component Required</h3>
      <div class="form-group grid-2">
        <div>
          <label>Part Width (mm)</label>
          <input type="number" id="partW" value="300">
        </div>
        <div>
          <label>Part Height (mm)</label>
          <input type="number" id="partH" value="400">
        </div>
      </div>
      <div class="form-group">
        <label>Required Quantity</label>
        <input type="number" id="partQty" value="15">
      </div>

      <h3>3. Laser Parameters</h3>
      <div class="form-group grid-2">
        <div>
          <label>Cutting Speed (mm/min)</label>
          <input type="number" id="cutSpeed" value="2500">
        </div>
        <div>
          <label>Part Spacing / Kerf (mm)</label>
          <input type="number" id="spacing" value="5">
        </div>
      </div>

      <button onclick="calculateAndRender()">Calculate & Optimize Layout</button>
    </div>

    <!-- Output & Canvas Panel -->
    <div class="panel">
      <h3>Nesting Preview & Output</h3>
      
      <div class="results-grid">
        <div class="stat-card">
          <div class="val" id="resParts">0</div>
          <div class="lbl">Fitted Parts</div>
        </div>
        <div class="stat-card">
          <div class="val" id="resSheets">0</div>
          <div class="lbl">Sheets Needed</div>
        </div>
        <div class="stat-card">
          <div class="val" id="resUtil">0%</div>
          <div class="lbl">Sheet Utilization</div>
        </div>
        <div class="stat-card">
          <div class="val" id="resTime">0m 0s</div>
          <div class="lbl">Est. Laser Cut Time</div>
        </div>
      </div>

      <div class="canvas-container">
        <canvas id="nestCanvas" width="600" height="400"></canvas>
      </div>
    </div>

  </div>

  <script>
    function calculateAndRender() {
      const sheetW = parseFloat(document.getElementById('sheetW').value);
      const sheetH = parseFloat(document.getElementById('sheetH').value);
      const partW = parseFloat(document.getElementById('partW').value);
      const partH = parseFloat(document.getElementById('partH').value);
      const partQty = parseInt(document.getElementById('partQty').value);
      const spacing = parseFloat(document.getElementById('spacing').value);
      const cutSpeed = parseFloat(document.getElementById('cutSpeed').value);
      const matType = document.getElementById('matType').value;
      const thickness = document.getElementById('thickness').value;

      const effPartW = partW + spacing;
      const effPartH = partH + spacing;

      // Calculate grid placement per sheet
      const cols = Math.floor((sheetW + spacing) / effPartW);
      const rows = Math.floor((sheetH + spacing) / effPartH);
      const partsPerSheet = cols * rows;

      if (partsPerSheet === 0) {
        alert("Part size with spacing is larger than sheet dimensions!");
        return;
      }

      const sheetsNeeded = Math.ceil(partQty / partsPerSheet);
      
      // Material efficiency calculation
      const singleSheetArea = sheetW * sheetH;
      const totalPartAreaOnSheet = partsPerSheet * (partW * partH);
      const utilization = ((totalPartAreaOnSheet / singleSheetArea) * 100).toFixed(1);

      // Laser time calculation: Total perimeter cut length per sheet
      const partPerimeter = 2 * (partW + partH);
      const totalCutLengthMM = partsPerSheet * partPerimeter;
      const totalMinutes = totalCutLengthMM / cutSpeed;
      const mins = Math.floor(totalMinutes);
      const secs = Math.round((totalMinutes - mins) * 60);

      // Render stats
      document.getElementById('resParts').innerText = `${partsPerSheet} / sheet`;
      document.getElementById('resSheets').innerText = sheetsNeeded;
      document.getElementById('resUtil').innerText = `${utilization}%`;
      document.getElementById('resTime').innerText = `${mins}m ${secs}s`;

      // Canvas Draw Layout
      drawLayout(sheetW, sheetH, partW, partH, cols, rows, spacing);

      // Save calculation to Local History (Gemini-style)
      saveToHistory({
        title: `${matType} ${thickness}mm - ${partW}x${partH}mm`,
        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        details: `${partsPerSheet} parts/sheet | Util: ${utilization}% | Time: ${mins}m ${secs}s`
      });
    }

    function drawLayout(sheetW, sheetH, partW, partH, cols, rows, spacing) {
      const canvas = document.getElementById('nestCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Scale to fit canvas
      const padding = 20;
      const scale = Math.min((canvas.width - padding * 2) / sheetW, (canvas.height - padding * 2) / sheetH);

      const renderSheetW = sheetW * scale;
      const renderSheetH = sheetH * scale;

      // Draw Base Sheet
      ctx.fillStyle = '#334155';
      ctx.fillRect(padding, padding, renderSheetW, renderSheetH);
      ctx.strokeStyle = '#94a3b8';
      ctx.strokeRect(padding, padding, renderSheetW, renderSheetH);

      // Draw Placed Parts
      ctx.fillStyle = '#38bdf8';
      ctx.strokeStyle = '#0284c7';

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = padding + (c * (partW + spacing)) * scale;
          const y = padding + (r * (partH + spacing)) * scale;
          const w = partW * scale;
          const h = partH * scale;

          ctx.fillRect(x, y, w, h);
          ctx.strokeRect(x, y, w, h);
        }
      }
    }

    function saveToHistory(record) {
      let history = JSON.parse(localStorage.getItem('steel_calc_history') || '[]');
      history.unshift(record);
      if (history.length > 20) history.pop();
      localStorage.setItem('steel_calc_history', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const historyList = document.getElementById('historyList');
      const history = JSON.parse(localStorage.getItem('steel_calc_history') || '[]');
      historyList.innerHTML = history.map(item => `
        <div class="history-item">
          <div class="title">${item.title}</div>
          <div class="meta">${item.date} — ${item.details}</div>
        </div>
      `).join('');
    }

    // Initial render
    renderHistory();
    calculateAndRender();
  </script>
</body>
</html>

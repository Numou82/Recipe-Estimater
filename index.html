<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steel Fabrication Nesting & Laser Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #090d16;
      --sidebar-bg: #0d1322;
      --card-bg: #151e32;
      --card-bg-hover: #1c2742;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --input-bg: #0b1120;
      --input-border: #334155;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
    }

    body { 
      background-color: var(--bg-color); 
      color: var(--text-main); 
      display: flex; 
      height: 100vh; 
      overflow: hidden; 
      -webkit-font-smoothing: antialiased;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* Sidebar History */
    .sidebar { 
      width: 300px; 
      background-color: var(--sidebar-bg); 
      border-right: 1px solid var(--border-color); 
      display: flex; 
      flex-direction: column; 
      padding: 1.25rem; 
      flex-shrink: 0;
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
    }
    .sidebar h2 { 
      font-size: 0.95rem; 
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent-color); 
    }
    .history-list { 
      flex: 1; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 0.6rem; 
      padding-right: 0.25rem;
    }
    .history-item { 
      background: var(--card-bg); 
      padding: 0.85rem; 
      border-radius: 8px; 
      cursor: pointer; 
      border: 1px solid var(--border-color); 
      transition: all 0.2s ease;
    }
    .history-item:hover { 
      border-color: var(--accent-color); 
      background: var(--card-bg-hover);
      transform: translateY(-1px);
    }
    .history-item .title { 
      font-size: 0.85rem;
      font-weight: 600; 
      color: var(--text-main);
      margin-bottom: 0.25rem; 
    }
    .history-item .meta { 
      color: var(--text-muted); 
      font-size: 0.75rem; 
      line-height: 1.3;
    }

    /* Main Content */
    .main-container { 
      flex: 1; 
      display: grid; 
      grid-template-columns: 380px 1fr; 
      gap: 1.25rem; 
      padding: 1.25rem; 
      overflow-y: auto; 
    }
    .panel { 
      background: var(--card-bg); 
      border: 1px solid var(--border-color); 
      border-radius: 12px; 
      padding: 1.5rem; 
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    h3 { 
      font-size: 0.85rem; 
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-color); 
      border-bottom: 1px solid var(--border-color); 
      padding-bottom: 0.5rem; 
    }

    .form-group { margin-bottom: 0.25rem; }
    label { 
      display: block; 
      font-size: 0.75rem; 
      font-weight: 600;
      color: var(--text-muted); 
      margin-bottom: 0.35rem; 
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    input, select { 
      width: 100%; 
      padding: 0.6rem 0.75rem; 
      background: var(--input-bg); 
      border: 1px solid var(--input-border); 
      border-radius: 6px; 
      color: var(--text-main); 
      font-size: 0.875rem; 
      outline: none;
      transition: all 0.2s ease;
    }
    input:focus, select:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

    button { 
      width: 100%; 
      padding: 0.85rem; 
      background: var(--accent-color); 
      color: #090d16; 
      border: none; 
      border-radius: 6px; 
      font-size: 0.875rem;
      font-weight: 700; 
      letter-spacing: 0.02em;
      cursor: pointer; 
      margin-top: 0.5rem; 
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
    }
    button:hover { 
      background: var(--accent-hover); 
      color: #fff; 
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.3);
    }
    button:active { transform: translateY(1px); }

    /* Output Section */
    .results-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); 
      gap: 0.75rem; 
    }
    .stat-card { 
      background: var(--input-bg); 
      padding: 1rem; 
      border-radius: 8px; 
      border: 1px solid var(--border-color); 
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
      background: var(--accent-color);
    }
    .stat-card .val { 
      font-size: 1.35rem; 
      font-weight: 700; 
      color: var(--text-main); 
      line-height: 1.2;
    }
    .stat-card .lbl { 
      font-size: 0.7rem; 
      font-weight: 600;
      color: var(--text-muted); 
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-top: 0.25rem;
    }

    .canvas-container { 
      background: var(--input-bg); 
      border: 1px solid var(--border-color); 
      border-radius: 8px; 
      padding: 1.25rem; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      flex: 1;
      min-height: 380px; 
    }
    canvas { 
      background: #10172a; 
      border: 1px dashed var(--input-border); 
      border-radius: 4px;
      max-width: 100%; 
      max-height: 480px; 
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Calculation History</h2>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

  <div class="main-container">
    
    <div class="panel">
      <div>
        <h3>1. Material & Sheet</h3>
        <div class="form-group grid-2" style="margin-top: 0.75rem;">
          <div>
            <label>Material Type</label>
            <select id="matType">
              <option value="SS">Stainless Steel (SS)</option>
              <option value="MS">Mild Steel (MS)</option>
            </select>
          </div>
          <div>
            <label>Thickness (mm)</label>
            <input type="number" id="thickness" value="2.0" step="0.1">
          </div>
        </div>

        <div class="form-group grid-2">
          <div>
            <label>Sheet Width (mm)</label>
            <input type="number" id="sheetW" value="1250">
          </div>
          <div>
            <label>Sheet Height (mm)</label>
            <input type="number" id="sheetH" value="2500">
          </div>
        </div>
      </div>

      <div>
        <h3>2. Component Required</h3>
        <div class="form-group grid-2" style="margin-top: 0.75rem;">
          <div>
            <label>Part Width (mm)</label>
            <input type="number" id="partW" value="300">
          </div>
          <div>
            <label>Part Height (mm)</label>
            <input type="number" id="partH" value="400">
          </div>
        </div>
        <div class="form-group">
          <label>Required Quantity</label>
          <input type="number" id="partQty" value="15">
        </div>
      </div>

      <div>
        <h3>3. Laser Parameters</h3>
        <div class="form-group grid-2" style="margin-top: 0.75rem;">
          <div>
            <label>Cutting Speed (mm/min)</label>
            <input type="number" id="cutSpeed" value="2500">
          </div>
          <div>
            <label>Part Spacing / Kerf (mm)</label>
            <input type="number" id="spacing" value="5">
          </div>
        </div>
      </div>

      <button onclick="calculateAndRender()">Calculate & Optimize Layout</button>
    </div>

    <div class="panel">
      <h3>Nesting Preview & Output</h3>
      
      <div class="results-grid">
        <div class="stat-card">
          <div class="val" id="resParts">0</div>
          <div class="lbl">Fitted Parts</div>
        </div>
        <div class="stat-card">
          <div class="val" id="resSheets">0</div>
          <div class="lbl">Sheets Needed</div>
        </div>
        <div class="stat-card">
          <div class="val" id="resUtil">0%</div>
          <div class="lbl">Sheet Utilization</div>
        </div>
        <div class="stat-card">
          <div class="val" id="resTime">0m 0s</div>
          <div class="lbl">Est. Laser Cut Time</div>
        </div>
      </div>

      <div class="canvas-container">
        <canvas id="nestCanvas" width="600" height="400"></canvas>
      </div>
    </div>

  </div>

  <script>
    function calculateAndRender() {
      const sheetW = parseFloat(document.getElementById('sheetW').value);
      const sheetH = parseFloat(document.getElementById('sheetH').value);
      const partW = parseFloat(document.getElementById('partW').value);
      const partH = parseFloat(document.getElementById('partH').value);
      const partQty = parseInt(document.getElementById('partQty').value);
      const spacing = parseFloat(document.getElementById('spacing').value);
      const cutSpeed = parseFloat(document.getElementById('cutSpeed').value);
      const matType = document.getElementById('matType').value;
      const thickness = document.getElementById('thickness').value;

      const effPartW = partW + spacing;
      const effPartH = partH + spacing;

      // Calculate grid placement per sheet
      const cols = Math.floor((sheetW + spacing) / effPartW);
      const rows = Math.floor((sheetH + spacing) / effPartH);
      const partsPerSheet = cols * rows;

      if (partsPerSheet === 0) {
        alert("Part size with spacing is larger than sheet dimensions!");
        return;
      }

      const sheetsNeeded = Math.ceil(partQty / partsPerSheet);
      
      // Material efficiency calculation
      const singleSheetArea = sheetW * sheetH;
      const totalPartAreaOnSheet = partsPerSheet * (partW * partH);
      const utilization = ((totalPartAreaOnSheet / singleSheetArea) * 100).toFixed(1);

      // Laser time calculation: Total perimeter cut length per sheet
      const partPerimeter = 2 * (partW + partH);
      const totalCutLengthMM = partsPerSheet * partPerimeter;
      const totalMinutes = totalCutLengthMM / cutSpeed;
      const mins = Math.floor(totalMinutes);
      const secs = Math.round((totalMinutes - mins) * 60);

      // Render stats
      document.getElementById('resParts').innerText = `${partsPerSheet} / sheet`;
      document.getElementById('resSheets').innerText = sheetsNeeded;
      document.getElementById('resUtil').innerText = `${utilization}%`;
      document.getElementById('resTime').innerText = `${mins}m ${secs}s`;

      // Canvas Draw Layout
      drawLayout(sheetW, sheetH, partW, partH, cols, rows, spacing);

      // Save calculation to Local History
      saveToHistory({
        title: `${matType} ${thickness}mm - ${partW}x${partH}mm`,
        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        details: `${partsPerSheet} parts/sheet | Util: ${utilization}% | Time: ${mins}m ${secs}s`
      });
    }

    function drawLayout(sheetW, sheetH, partW, partH, cols, rows, spacing) {
      const canvas = document.getElementById('nestCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Scale to fit canvas
      const padding = 20;
      const scale = Math.min((canvas.width - padding * 2) / sheetW, (canvas.height - padding * 2) / sheetH);

      const renderSheetW = sheetW * scale;
      const renderSheetH = sheetH * scale;

      // Draw Base Sheet
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(padding, padding, renderSheetW, renderSheetH);
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 1;
      ctx.strokeRect(padding, padding, renderSheetW, renderSheetH);

      // Draw Placed Parts
      ctx.fillStyle = '#38bdf8';
      ctx.strokeStyle = '#0284c7';

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = padding + (c * (partW + spacing)) * scale;
          const y = padding + (r * (partH + spacing)) * scale;
          const w = partW * scale;
          const h = partH * scale;

          ctx.fillRect(x, y, w, h);
          ctx.strokeRect(x, y, w, h);
        }
      }
    }

    function saveToHistory(record) {
      let history = JSON.parse(localStorage.getItem('steel_calc_history') || '[]');
      history.unshift(record);
      if (history.length > 20) history.pop();
      localStorage.setItem('steel_calc_history', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const historyList = document.getElementById('historyList');
      const history = JSON.parse(localStorage.getItem('steel_calc_history') || '[]');
      historyList.innerHTML = history.map(item => `
        <div class="history-item">
          <div class="title">${item.title}</div>
          <div class="meta">${item.date} — ${item.details}</div>
        </div>
      `).join('');
    }

    // Initial render
    renderHistory();
    calculateAndRender();
  </script>
</body>
</html>
